name: CI

on:
  push:
    branches: [main, pagepocket]
  pull_request:
    branches: [main, pagepocket]
  # D13/4.2: the deploy gate's failure message tells you to (re-)run CI for
  # a commit manually — make that possible.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Determine which components changed so we only run relevant jobs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Push events diff against the previous commit (any branch); PRs
          # diff against the PR base. (5.7: CI runs on main AND pagepocket —
          # pagepocket is the production trunk and must never diverge
          # untested from main again.)
          base: ${{ github.event.before || github.event.pull_request.base.sha }}
          filters: |
            extension:
              - 'src/**'
              - 'background.js'
              - 'public/**'
              - 'vite.config.ts'
              - 'package.json'
              - 'tsconfig.json'
              - '*.cjs'
              - 'tests/**'
            frontend:
              - 'pagepocket/frontend/**'
            backend:
              - 'pagepocket/services/**'
              - 'pagepocket/shared/**'
              - 'pagepocket/proto/**'
              - 'pagepocket/Makefile'
              - 'pagepocket/docker-compose*.yml'
              # D13/4.4: maintenance-sidecar, dev-dependency and schema
              # changes can never silently skip CI (or deploy — deploy.yml
              # keeps its filters consistent with these).
              - 'scripts/prod/archive-maintenance/**'
              - 'pagepocket/requirements-dev.txt'
              - 'pagepocket/init.sql'
            server:
              - 'server/**'

  # ---------------------------------------------------------------------------
  # Browser extension (repo root)
  # ---------------------------------------------------------------------------
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        # 4.11: CI must fail on a pnpm-lock.yaml out of sync with the code.
        run: pnpm install --frozen-lockfile

      - name: Style check
        run: pnpm style

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload extension zip
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: zip/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pagepocket/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: undici v8 (direct dependency) uses util.markAsUncloneable,
          # which Node 20 lacks — the build crashes during page-data collection.
          node-version: 22
          cache: pnpm
          cache-dependency-path: pagepocket/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders (src/lib/env.ts validates these). Real
          # values are injected by the deployment platform at runtime.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8090/api/v1
          NEXT_PUBLIC_MARKETING_SITE_URL: http://localhost:3000
          COOKIE_SECRET: ci-build-only-placeholder

      - name: Size limit
        run: pnpm size-limit

  # ---------------------------------------------------------------------------
  # Backend (Python gRPC services + gateway)
  # ---------------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: pagepocket/shared:pagepocket/shared/proto_generated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 4.11: cache pip downloads keyed on every requirements file.
          cache: pip
          cache-dependency-path: pagepocket/**/requirements*.txt

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest grpcio-tools

      - name: Install service dependencies
        run: |
          for f in pagepocket/services/*/requirements.txt; do
            echo "Installing $f"
            pip install -r "$f"
          done
          # test-only deps (fakeredis, httpx for the integration suite)
          pip install -r pagepocket/requirements-dev.txt

      - name: Generate gRPC stubs
        working-directory: pagepocket
        run: make proto

      # 5.6: the generated stubs are tracked in git for reproducibility — a
      # commit that changes proto/*.proto without regenerating them must
      # fail here, not surface as a confusing wire-contract drift later.
      - name: Fail on stale generated stubs
        run: |
          if ! git diff --exit-code -- pagepocket/shared/proto_generated; then
            echo "::error::pagepocket/shared/proto_generated is stale. Run 'make proto' inside pagepocket/ and commit the regenerated stubs."
            exit 1
          fi

      - name: Lint
        working-directory: pagepocket
        run: make lint

      - name: Unit tests (all services, api-gateway included)
        working-directory: pagepocket
        run: make test

      # 5.1: the 17 gateway integration tests hit a LIVE stack. They used to
      # self-skip forever because nothing booted the stack; make
      # test-integration starts the full compose project (mysql + redis +
      # 5 services + gateway), waits for /api/v1/health and fails if the
      # tests cannot run against it.
      - name: Integration tests (full compose stack)
        working-directory: pagepocket
        run: make test-integration

  # ---------------------------------------------------------------------------
  # Monolith (server/) — 5.2: previously had no CI job at all; the 6
  # test_session_lifecycle failures shipped silently.
  # ---------------------------------------------------------------------------
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 4.11: pip download cache (server deps + the shared test extras).
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          # test-only deps: pytest-asyncio (async tests), aiosqlite (the
          # SQLite-backed ORM fixtures in server/tests/conftest.py), httpx
          pip install pytest pytest-asyncio aiosqlite httpx

      - name: Run monolith test suite
        working-directory: server
        run: python -m pytest tests/ -q
