name: Deploy

on:
  push:
    branches: [pagepocket]
  workflow_dispatch:

permissions:
  contents: read

# Never overlap deploys; queue instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Determine which components changed so we only deploy what is necessary.
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Push events diff against the previous commit; manual runs have no
          # `before` SHA, so fall back to the default branch (deploys all).
          base: ${{ github.event.before || github.event.repository.default_branch }}
          filters: |
            extension:
              - 'src/**'
              - 'background.js'
              - 'public/**'
              - 'vite.config.ts'
              - 'package.json'
              - 'tsconfig.json'
              - 'jest.config.cjs'
              - '*.cjs'
              - 'tests/**'
            frontend:
              - 'pagepocket/frontend/**'
            backend:
              - 'pagepocket/services/**'
              - 'pagepocket/shared/**'
              - 'pagepocket/proto/**'
              - 'pagepocket/docker-compose*.yml'

  # ---------------------------------------------------------------------------
  # Extension: build the .zip artifact for manual store publishing.
  # ---------------------------------------------------------------------------
  extension-artifact:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: zip/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Backend: deploy to Contabo via SSH (hard reset to origin/pagepocket, then
  # rebuild the 5 gRPC services and restart the api-gateway; plain compose).
  # ---------------------------------------------------------------------------
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Contabo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/Web-Downloader-Extension
            git fetch origin
            git reset --hard origin/pagepocket
            cd pagepocket
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps archive-service auth-service library-service search-service share-service
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart api-gateway
            echo "==> Backend containers after deploy:"
            docker ps --filter name=pagepocket --format '{{.Names}}\t{{.Status}}'

  # ---------------------------------------------------------------------------
  # Frontend: deploy to Contabo via SSH (hard reset, pnpm build, keep one
  # .next backup, restart plain `next start` on :3000, verify with curl).
  # ---------------------------------------------------------------------------
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to Contabo
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/Web-Downloader-Extension
            git fetch origin
            git reset --hard origin/pagepocket
            cd pagepocket/frontend
            # node lives under nvm on the server and is absent from
            # non-interactive shells; sourcing nvm.sh activates the default.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            if ! command -v pnpm >/dev/null 2>&1; then
              corepack enable || npm install -g pnpm@10
            fi
            pnpm install --frozen-lockfile
            pnpm build
            # Keep one previous good build for rollback (hardlink copy is cheap).
            rm -rf .next.bak-*
            cp -al .next ".next.bak-$(date +%s)"
            # Frontend runs under PM2 (app: pagepocket-frontend). Stop it first
            # so it cannot respawn mid-restart, clear any orphan next-server
            # squatting on :3000, then let PM2 own the process again.
            pm2 stop pagepocket-frontend > /dev/null 2>&1 || true
            pkill -f 'next[-]server' || true
            sleep 2
            pm2 restart pagepocket-frontend --update-env > /dev/null 2>&1 || \
              pm2 start npm --name pagepocket-frontend -- run start > /dev/null 2>&1
            pm2 save > /dev/null 2>&1 || true
            code=000
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
              sleep 2
            done
            echo "==> Frontend :3000 HTTP status: ${code:-none}"
            case "$code" in
              2*|3*) exit 0 ;;
              *) echo "::error::frontend did not respond on :3000 (check pm2 logs pagepocket-frontend on server)"; exit 1 ;;
            esac
