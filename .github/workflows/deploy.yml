name: Deploy

on:
  push:
    branches: [pagepocket]
  workflow_dispatch:

permissions:
  contents: read

# Never overlap deploys; queue instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Determine which components changed so we only deploy what is necessary.
  changes:
    runs-on: ubuntu-latest
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Push events diff against the previous commit; manual runs have no
          # `before` SHA, so fall back to the default branch (deploys all).
          base: ${{ github.event.before || github.event.repository.default_branch }}
          filters: |
            extension:
              - 'src/**'
              - 'background.js'
              - 'public/**'
              - 'vite.config.ts'
              - 'package.json'
              - 'tsconfig.json'
              - '*.cjs'
              - 'tests/**'
            frontend:
              - 'pagepocket/frontend/**'
            backend:
              - 'pagepocket/services/**'
              - 'pagepocket/shared/**'
              - 'pagepocket/proto/**'
              - 'pagepocket/docker-compose*.yml'
              # D13/4.4: keep deploy filters consistent with ci.yml —
              # maintenance-sidecar, dev-dependency and schema changes must
              # deploy (the sidecar bind-mounts scripts/prod/archive-maintenance
              # read-only, and the compose files/init.sql shape the runtime).
              - 'scripts/prod/archive-maintenance/**'
              - 'pagepocket/requirements-dev.txt'
              - 'pagepocket/init.sql'

  # ---------------------------------------------------------------------------
  # 5.8 + D13/4.3: a deploy must never run untested code. CI (ci.yml)
  # triggers on the same push to `pagepocket`, so a run for github.sha must
  # exist — this job waits (poll, 30 min budget) for that run to complete
  # and requires a green conclusion. It now ALWAYS runs (no backend
  # condition): frontend-only changes are CI-gated too, since deploy-
  # frontend needs this job. A run for a SHA that never had CI (manual
  # dispatch of an old commit) times out here by design; re-push or
  # workflow_dispatch ci.yml (D13/4.4) for the commit first.
  # ---------------------------------------------------------------------------
  ci-gate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            json=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1")
            count=$(echo "$json" | jq -r '.total_count')
            if [ "$count" != "0" ]; then
              status=$(echo "$json" | jq -r '.workflow_runs[0].status')
              conclusion=$(echo "$json" | jq -r '.workflow_runs[0].conclusion')
              echo "CI for $SHA: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "==> CI is green on $SHA — deploy may proceed"
                  exit 0
                fi
                echo "::error::CI concluded '$conclusion' for $SHA — deploy blocked"
                exit 1
              fi
            else
              echo "no CI run for $SHA yet — waiting (poll every 30s)"
            fi
            sleep 30
          done
          echo "::error::no completed CI run for $SHA within 30 minutes — deploy blocked. Re-push, or trigger the CI workflow manually for this commit: gh workflow run ci.yml --ref pagepocket (D13/4.4 added workflow_dispatch)."
          exit 1

  # ---------------------------------------------------------------------------
  # Extension: build the .zip artifact for manual store publishing.
  # ---------------------------------------------------------------------------
  extension-artifact:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: zip/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Backend: deploy to Contabo via SSH. Order per deploy (5.6/5.8/5.11):
  #   hard reset -> scoped image builds -> infra up -> per-service
  #   `alembic upgrade head` (the single authoritative schema mechanism,
  #   run BEFORE the new containers start serving) -> service recreation ->
  #   gateway recreation + restart (stale gRPC channels to recreated
  #   services are a known gotcha) -> GET /api/v1/health poll (30x2s),
  #   failing the job on timeout. NOTE: the health endpoint must be polled
  #   with GET (the monolith rejects HEAD; use GET everywhere).
  # ---------------------------------------------------------------------------
  deploy-backend:
    needs: [changes, ci-gate]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Contabo
        uses: appleboy/ssh-action@v1
        env:
          # D13/4.2: pin the deploy to EXACTLY the commit that passed the
          # gate. Resetting to origin/pagepocket could ship an UNGATED newer
          # tip that landed while this run queued.
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/Web-Downloader-Extension
            git fetch origin
            remote_tip="$(git rev-parse origin/pagepocket)"
            if [ "$remote_tip" != "$DEPLOY_SHA" ]; then
              echo "::error::queue-race: origin/pagepocket is ${remote_tip} but this deploy is gated on ${DEPLOY_SHA}. Refusing to ship the ungated tip — re-run the deploy workflow (it will pick up the newer gated SHA)."
              exit 1
            fi
            git reset --hard "$DEPLOY_SHA"
            echo "==> host tree pinned at gated SHA $(git rev-parse HEAD)"
            cd pagepocket
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            echo "==> Building images (fail fast before touching the runtime)"
            $COMPOSE build auth-service archive-service library-service search-service share-service archive-maintenance api-gateway
            echo "==> Ensuring infra (mysql, redis) is up for migrations"
            $COMPOSE up -d --no-deps mysql redis
            echo "==> Alembic upgrade head per service (5.6: authoritative schema mechanism)"
            for svc in auth-service archive-service library-service search-service share-service; do
              echo "---- alembic: $svc"
              $COMPOSE run --rm -T --no-deps $svc python -m alembic -c /app/alembic.ini upgrade head
            done
            echo "==> Recreating services"
            $COMPOSE up -d --no-deps auth-service archive-service library-service search-service share-service archive-maintenance
            echo "==> Gateway: recreate (picks up env changes) + restart (re-dials gRPC channels)"
            $COMPOSE up -d --no-deps api-gateway
            $COMPOSE restart api-gateway
            echo "==> Backend containers after deploy:"
            $COMPOSE ps
            echo "==> Post-deploy health gate (GET, 30 x 2s)"
            code=000
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/v1/health || true)
              if [ "$code" = "200" ]; then
                echo "==> gateway healthy after $i attempt(s)"
                break
              fi
              sleep 2
            done
            if [ "$code" != "200" ]; then
              echo "::error::backend health check failed — :8090/api/v1/health never returned 200; rolling forward is NOT automatic, see scripts/prod/README.md (rollback)"
              $COMPOSE logs --tail=50 api-gateway || true
              exit 1
            fi

  # ---------------------------------------------------------------------------
  # Frontend: deploy to Contabo via SSH (hard reset, pnpm build, keep one
  # .next backup, restart, verify with curl). Process-manager reality per the
  # 2026-10-15 spike: there is NO pm2 on the host — the server is a plain
  # nohup `next start`. The pm2 branch below is kept (harmless if absent, in
  # case pm2 returns) but the fallback now actually starts the server.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    # D13/4.3: CI-gated like the backend — the gate now always runs, so a
    # frontend-only push (where the old backend-conditioned gate skipped)
    # can no longer deploy with red or missing CI.
    needs: [changes, ci-gate]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to Contabo
        uses: appleboy/ssh-action@v1
        env:
          # D13/4.2: same SHA pinning as deploy-backend.
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/Web-Downloader-Extension
            git fetch origin
            remote_tip="$(git rev-parse origin/pagepocket)"
            if [ "$remote_tip" != "$DEPLOY_SHA" ]; then
              echo "::error::queue-race: origin/pagepocket is ${remote_tip} but this deploy is gated on ${DEPLOY_SHA}. Refusing to ship the ungated tip — re-run the deploy workflow (it will pick up the newer gated SHA)."
              exit 1
            fi
            git reset --hard "$DEPLOY_SHA"
            echo "==> host tree pinned at gated SHA $(git rev-parse HEAD)"
            cd pagepocket/frontend
            # node lives under nvm on the server and is absent from
            # non-interactive shells; sourcing nvm.sh activates the default.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            if ! command -v pnpm >/dev/null 2>&1; then
              corepack enable || npm install -g pnpm@10
            fi
            pnpm install --frozen-lockfile
            pnpm build
            # Keep one previous good build for rollback (hardlink copy is cheap).
            rm -rf .next.bak-*
            cp -al .next ".next.bak-$(date +%s)"
            # Stop whatever serves :3000 first so it cannot respawn
            # mid-restart, clear any orphan squatters, then start again.
            # NB: keep this script free of the literal patterns used by the
            # pkill lines below - the whole script text is visible in this
            # shell's cmdline and pkill -f would otherwise match it.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop pagepocket-frontend > /dev/null 2>&1 || true
            fi
            pkill -f 'next[-]server' || true
            sleep 2
            if command -v pm2 >/dev/null 2>&1 && pm2 describe pagepocket-frontend > /dev/null 2>&1; then
              pm2 restart pagepocket-frontend --update-env > /dev/null 2>&1
            else
              # no-pm2 reality (spike): plain nohup start with a log file.
              nohup npm run start > next.log 2>&1 &
            fi
            if command -v pm2 >/dev/null 2>&1; then pm2 save > /dev/null 2>&1 || true; fi
            code=000
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
              sleep 2
            done
            echo "==> Frontend :3000 HTTP status: ${code:-none}"
            case "$code" in
              2*|3*) exit 0 ;;
              *) echo "::error::frontend did not respond on :3000 (check next.log on server)"; exit 1 ;;
            esac
