syntax = "proto3";

package share;

import "common.proto";

service ShareService {
  rpc CreateShareLink(CreateShareLinkRequest) returns (ShareLinkResponse);
  rpc GetShareLink(GetShareLinkRequest) returns (ShareLinkResponse);
  rpc GetShareLinkByPage(GetShareLinkByPageRequest) returns (ShareLinkResponse);
  rpc RevokeShareLink(RevokeShareLinkRequest) returns (common.StatusResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateShareResponse);
  // Additive (harden-pagepocket-platform D6/2.3): revokes every share link
  // referencing a page, invoked best-effort by the archive-service when the
  // page is deleted so no public link outlives its page.
  rpc RevokeLinksForPage(RevokeLinksForPageRequest) returns (common.StatusResponse);
}

message CreateShareLinkRequest {
  string user_id = 1;
  string page_id = 2;
  bool is_public = 3;
  int64 expires_at = 4; // 0 = never
}

message GetShareLinkRequest {
  string token = 1;
}

message GetShareLinkByPageRequest {
  string user_id = 1;
  string page_id = 2;
}

message RevokeShareLinkRequest {
  string token = 1;
  string user_id = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ShareLinkResponse {
  string token = 1;
  string short_url = 2;
  bool is_public = 3;
  int64 expires_at = 4;
  int32 view_count = 5;
  string page_id = 6;
  string user_id = 7;
  string created_at = 8;
  string revoked_at = 9;
}

message ValidateShareResponse {
  bool valid = 1;
  string page_id = 2;
  // Page owner resolved at validation time so downstream file access can use
  // mandatory ownership checks (additive field — see harden-backend-security-and-ops D3/D9).
  string owner_user_id = 3;
}

message RevokeLinksForPageRequest {
  string page_id = 1;
}
