syntax = "proto3";

package auth;

import "common.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GoogleAuth(GoogleAuthRequest) returns (AuthResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (common.StatusResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

// Google sign-in (easier-auth D4): the extension runs the PKCE
// launchWebAuthFlow and hands over the authorization code; the backend does
// the code exchange (client secret stays server-side) and verifies the ID
// token before issuing the platform's normal token pair.
message GoogleAuthRequest {
  string code = 1;
  string code_verifier = 2;
  string redirect_uri = 3;
}

message VerifyRequest {
  string token = 1;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string user_id = 1;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string plan = 4;
  bool is_verified = 5;
  string created_at = 6;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
  User user = 4;
}

message VerifyResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string plan = 4;
}
