syntax = "proto3";

package archive;

import "common.proto";

service ArchiveService {
  rpc IngestPage(IngestPageRequest) returns (IngestPageResponse);
  rpc GetPage(GetPageRequest) returns (PageResponse);
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse);
  rpc DeletePage(DeletePageRequest) returns (common.StatusResponse);
  rpc GetPageContent(GetPageContentRequest) returns (PageContentResponse);
  rpc GetArchiveFile(GetArchiveFileRequest) returns (ArchiveFileResponse);
  // Additive (harden-backend-security-and-ops 3.8/5.9): internal maintenance
  // RPCs. Not proxied by the gateway; reachable only on the service network.
  rpc RetryPendingIndexing(RetryPendingIndexingRequest) returns (RetryPendingIndexingResponse);
  rpc SweepOrphanR2Objects(SweepOrphanR2ObjectsRequest) returns (SweepOrphanR2ObjectsResponse);
  // Additive (add-page-export-zip 1.1/D1): server-assembled ZIP download of
  // one archived page. The service lists the page's R2 prefix, spools a
  // zip64 ZIP to disk, and streams it back chunk-by-chunk; the gateway pipes
  // the stream straight into the HTTP response (never fully buffered).
  rpc ExportPage(ExportPageRequest) returns (stream ExportPageChunk);
  // Additive (storage-usage-display 1.1/D1): read-only storage-usage snapshot
  // for the sidebar meter. Strictly a display read: the service never locks
  // the quota row (no FOR UPDATE) and never applies the monthly rollover
  // here — that remains an ingest-time concern. The gateway proxies it with
  // the JWT's user_id and plan.
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);
}

message Asset {
  string filename = 1;
  string content_type = 2;
  bytes data = 3;
}

message IngestPageRequest {
  string user_id = 1;
  string url = 2;
  string title = 3;
  bytes html_content = 4;
  repeated Asset assets = 5;
  string extension_job_id = 6;
  // Deprecated: the service resolves the plan from the user's quota row;
  // this field is ignored (kept for wire compatibility with older senders).
  string plan = 7 [deprecated = true]; // historically "free", "pro", or "team"
}

message IngestPageResponse {
  bool success = 1;
  string page_id = 2;
  string message = 3;
}

message GetPageRequest {
  string page_id = 1;
  string user_id = 2;
}

message PageResponse {
  string id = 1;
  string user_id = 2;
  string url = 3;
  string title = 4;
  string preview_text = 5;
  // Field 6 previously carried r2_key (internal storage layout leak) —
  // removed in harden-pagepocket-platform D4; never reuse the tag.
  reserved 6;
  reserved "r2_key";
  int64 size_bytes = 7;
  string extension_job_id = 8;
  string archived_at = 9;
}

message ListPagesRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string sort_by = 4; // "archived_at" or "title"
  string collection_id = 5; // optional: filter to pages in this collection
}

message ListPagesResponse {
  repeated PageResponse pages = 1;
  int32 total = 2;
}

message DeletePageRequest {
  string page_id = 1;
  string user_id = 2;
}

message GetPageContentRequest {
  string page_id = 1;
  string user_id = 2;
}

message PageContentResponse {
  // Field 1 previously carried signed_url (a 1h presigned R2 URL) — removed
  // in harden-pagepocket-platform D4: archived content is delivered
  // exclusively via the sandboxed asset-serving path, so this RPC never
  // mints or returns a storage URL. Never reuse the tag.
  reserved 1;
  reserved "signed_url";
  int64 expires_at = 2;
}

message GetArchiveFileRequest {
  string page_id = 1;
  // Mandatory: the page owner's user id. Ownership is enforced on every
  // call — share-token access does NOT bypass user_id scoping (the gateway
  // resolves the owner from the share token and supplies it here).
  string user_id = 2;
  string file_path = 3; // e.g. "index.html" or "assets/images/foo.jpg"
}

message ArchiveFileResponse {
  bytes data = 1;
  string content_type = 2;
}

message RetryPendingIndexingRequest {
  int32 limit = 1; // max pages to retry in one pass; 0 = service default
}

message RetryPendingIndexingResponse {
  int32 retried = 1;
  int32 succeeded = 2;
}

message SweepOrphanR2ObjectsRequest {
  int64 grace_period_seconds = 1; // 0 = default (7 days)
  int32 max_prefixes = 2;         // safety cap on user prefixes scanned; 0 = unbounded
}

message SweepOrphanR2ObjectsResponse {
  int32 scanned_prefixes = 1;
  int32 deleted_prefixes = 2;
  int32 deleted_objects = 3;
  repeated string errors = 4;
}

message ExportPageRequest {
  string page_id = 1;
  // Mandatory: the page owner's user id. Ownership is enforced on every
  // call — a page that is missing or owned by someone else is always
  // NOT_FOUND (no existence leak), matching GetArchiveFile.
  string user_id = 2;
}

message ExportPageChunk {
  // One ordered slice of the export ZIP stream. Senders MUST NOT exceed
  // 512 KB per chunk (shared service-side constant, well under gRPC's 4 MB
  // default message cap — spec "Page ZIP Export / Streaming bounds").
  bytes data = 1;
}

message GetStorageUsageRequest {
  // Mandatory: the quota row's owner (storage-usage-display 1.2/D2). The
  // gateway always fills this from the verified JWT (`request.state.user_id`).
  string user_id = 1;
  // Authoritative plan from the JWT (D3) — the service maps it through
  // PLAN_LIMITS and echoes the limits back; the quota row itself carries no
  // plan. Defaults to "free" limits when unset/unknown (same fallback as
  // reserve_quota).
  string plan = 2;
}

message GetStorageUsageResponse {
  // Counter values straight from user_quotas (D2: the transactionally
  // maintained counters are trusted; no SUM(pages.size_bytes) reconciliation).
  int64 total_bytes = 1;
  int32 pages_this_month = 2;
  // Naive-UTC ISO-8601, same convention as PageResponse.archived_at. Empty
  // when the user has no quota row yet (proto3 scalars have no presence —
  // the gateway maps "" to null).
  string quota_reset_at = 3;
  // PLAN_LIMITS for the requested plan (D3): free 500 MB / 50 pages,
  // pro 10 GB, team 50 GB.
  int64 storage_limit_bytes = 4;
  int32 page_limit_monthly = 5;
  string plan = 6;
}
