# Proto/gRPC stubs are regenerated by `make proto` on every CI run.
exclude = ["shared/proto_generated"]

[lint.flake8-bugbear]
# FastAPI dependency/function defaults (File(...), Depends(...)) are evaluated
# once at import time by design; they are effectively immutable callables.
extend-immutable-calls = ["fastapi.File"]

[lint.per-file-ignores]
# Cache helper: cache/cleanup failures must never break the main request flow
# (graceful degradation is the design; client-level failures log once).
"shared/cache.py" = ["BLE001", "S110"]
# Servicers keep deliberate broad excepts at gRPC boundaries, but they all log
# now (7.6) — S110 (try-except-pass) is no longer tolerated anywhere.
"services/archive-service/servicer.py" = ["BLE001"]
"services/auth-service/servicer.py" = ["BLE001"]
# Test suites use broad try/except-pass only for availability probes and
# best-effort teardown (the only suites that still do this).
"services/api-gateway/tests/**" = ["BLE001", "S110"]
"services/search-service/tests/**" = ["BLE001", "S110"]
