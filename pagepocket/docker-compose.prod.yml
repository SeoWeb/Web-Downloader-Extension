# Production overlay (used together with docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Env vars REQUIRED in the host pagepocket/.env before any deploy:
#   REDIS_PASSWORD      prod compose refuses to render without it (5.10)
#   JWT_SECRET          gateway refuses to boot with the dev default (4.6)
#   MYSQL_ROOT_PASSWORD no committed default may survive in prod (5.12 rotates)
#   BASE_URL            share-service refuses to boot without it once
#                       ENVIRONMENT=production is armed here (4.8/D13-a)
#   DB_PASSWORD_AUTH / DB_PASSWORD_ARCHIVE / DB_PASSWORD_LIBRARY /
#   DB_PASSWORD_SEARCH / DB_PASSWORD_SHARE
#                       D12/2.16 — prod compose refuses to render without
#                       them; create the users first with
#                       scripts/prod/rotate-db-users.sh (it writes them)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#                       easier-auth — Google OAuth client credentials
#                       (easier-auth D7). Passthrough only below (no default,
#                       no committed secret): both services fail fast at boot
#                       with ENVIRONMENT=production when they are unset.
# Env vars OPTIONAL (sane pinned defaults in this file):
#   CORS_ALLOW_ORIGINS, TRUSTED_PROXIES, MAX_UPLOAD_BYTES,
#   MAX_INGEST_ASSETS, GATEWAY_WORKERS
#
# Loopback port contract (5.11, spike findings a/c): nginx on the host
# reaches the gateway via 127.0.0.1:8090; NOTHING is published on a public
# interface. The gateway has no public hostname at all.

services:
  mysql:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    ports: !override []

  redis:
    restart: always
    # 5.10: the password is REQUIRED in prod — compose fails to render the
    # config if REDIS_PASSWORD is missing from pagepocket/.env, so an
    # unauthenticated Redis can never come back by accident.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in pagepocket/.env - see scripts/prod/roll-redis-password.sh}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in pagepocket/.env - see scripts/prod/roll-redis-password.sh}
    deploy:
      resources:
        limits:
          memory: 256M

  auth-service:
    restart: always
    environment:
      # D12/2.16: the scoped least-privilege user — never root in prod.
      # The users + grants are provisioned/rotated by
      # scripts/prod/rotate-db-users.sh, which writes DB_PASSWORD_* into
      # pagepocket/.env (the :? guards below make an unprovisioned render
      # fail fast instead of falling back to root).
      DB_URL: mysql+pymysql://pagepocket_auth:${DB_PASSWORD_AUTH:?DB_PASSWORD_AUTH must be set in pagepocket/.env - run scripts/prod/rotate-db-users.sh first}@mysql:3306/auth_db
      # easier-auth: Google OAuth client credentials — env passthrough ONLY
      # (no default, no committed secret; the value lives in the host
      # pagepocket/.env). Required for GoogleAuth to work; the fail-fast
      # arms via ENVIRONMENT=production (config.py).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # 5.6: Alembic is the single authoritative schema mechanism; implicit
      # create_all must never shape prod schema.
      AUTO_CREATE: "false"
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      SERVER_KEY: /certs/auth-service-key.pem
      SERVER_CERT: /certs/auth-service.pem
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M
    ports: !override []

  archive-service:
    restart: always
    environment:
      DB_URL: mysql+pymysql://pagepocket_archive:${DB_PASSWORD_ARCHIVE:?DB_PASSWORD_ARCHIVE must be set in pagepocket/.env - run scripts/prod/rotate-db-users.sh first}@mysql:3306/archive_db
      AUTO_CREATE: "false"
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      SERVER_KEY: /certs/archive-service-key.pem
      SERVER_CERT: /certs/archive-service.pem
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 1G
    ports: !override []

  library-service:
    restart: always
    environment:
      DB_URL: mysql+pymysql://pagepocket_library:${DB_PASSWORD_LIBRARY:?DB_PASSWORD_LIBRARY must be set in pagepocket/.env - run scripts/prod/rotate-db-users.sh first}@mysql:3306/library_db
      AUTO_CREATE: "false"
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      SERVER_KEY: /certs/library-service-key.pem
      SERVER_CERT: /certs/library-service.pem
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M
    ports: !override []

  search-service:
    restart: always
    environment:
      DB_URL: mysql+pymysql://pagepocket_search:${DB_PASSWORD_SEARCH:?DB_PASSWORD_SEARCH must be set in pagepocket/.env - run scripts/prod/rotate-db-users.sh first}@mysql:3306/search_db
      AUTO_CREATE: "false"
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      SERVER_KEY: /certs/search-service-key.pem
      SERVER_CERT: /certs/search-service.pem
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M
    ports: !override []

  share-service:
    restart: always
    environment:
      DB_URL: mysql+pymysql://pagepocket_share:${DB_PASSWORD_SHARE:?DB_PASSWORD_SHARE must be set in pagepocket/.env - run scripts/prod/rotate-db-users.sh first}@mysql:3306/share_db
      # 4.8/D13-a: arm the share-service prod fail-fast. Its BASE_URL check
      # used to be dead code (ENVIRONMENT stayed unset here), so prod short
      # links pointed at the compose default http://localhost:8090. With
      # ENVIRONMENT=production the service refuses to boot unless BASE_URL
      # is a real public host — set it in pagepocket/.env (expected:
      # https://pagepocket.app). Arming + short-link verification is
      # deploy-gated (task 6.9).
      ENVIRONMENT: production
      BASE_URL: ${BASE_URL:?BASE_URL must be set in pagepocket/.env - public share-link base (e.g. https://pagepocket.app), see scripts/prod/README.md}
      AUTO_CREATE: "false"
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      SERVER_KEY: /certs/share-service-key.pem
      SERVER_CERT: /certs/share-service.pem
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M
    ports: !override []

  api-gateway:
    restart: always
    environment:
      AUTO_CREATE: "false"
      # 4.6: prod fail-fast on dev-default JWT_SECRET needs this to be set.
      ENVIRONMENT: production
      # easier-auth: passthrough only — required by the gateway's production
      # fail-fast (D7); the actual exchange happens in auth-service.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      CLIENT_KEY: /certs/api-gateway-key.pem
      CLIENT_CERT: /certs/api-gateway.pem
      # 4.6/D12: explicit origin allow-list (never "*"). Override via
      # pagepocket/.env to append published chrome-extension:// origins.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://pagepocket.app,https://app.pagepocket.app}
      # D12/4.5 + D13/1.9: which proxies may set X-Forwarded-For for
      # rate-limit identity. NARROWED default: only the docker bridge
      # gateway IPs a host->127.0.0.1:8090 connection can be source-NATed
      # to (nginx AND the host-side Next.js server both traverse
      # docker-proxy; there is no containerized frontend hop). Verify the
      # actual gateway address on the host:
      #   docker network inspect pagepocket_default \
      #     --format '{{(index .IPAM.Config 0).Gateway}}'
      # and set TRUSTED_PROXIES in pagepocket/.env accordingly — rollout
      # caution in scripts/prod/README.md §TRUSTED_PROXIES rollout.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.1,172.17.0.1}
    volumes:
      - ./certs:/certs:ro
    deploy:
      resources:
        limits:
          memory: 512M
    # 5.11: host-only binding — nginx proxies pagepocket API traffic to
    # 127.0.0.1:8090; the gateway must not be directly reachable from the
    # internet (spike finding a: it previously was, carrying only spoofable
    # client-supplied forwarding headers).
    ports:
      - "127.0.0.1:8090:8090"

  # 5.9 (prod side of the base-compose sidecar): mTLS identity + restart
  # policy. The loop script itself is mounted read-only from
  # ../scripts/prod/archive-maintenance (base compose).
  archive-maintenance:
    restart: always
    environment:
      MTLS_ENABLED: "true"
      CA_CERT: /certs/ca.pem
      # The api-gateway client cert is the only CA-signed client identity
      # that exists on the host today; the archive service verifies CA
      # signatures (no per-CN authorization), so this works without any
      # PKI change. A dedicated maintenance cert can replace it at the next
      # coordinated cert rotation (see scripts/prod/README.md).
      CLIENT_KEY: /certs/api-gateway-key.pem
      CLIENT_CERT: /certs/api-gateway.pem
    volumes:
      - ./certs:/certs:ro

# deploy pipeline probe (2026-10-02): exercises the deploy-backend changes gate.
