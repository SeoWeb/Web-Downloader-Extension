name: Frontend CI

on:
  pull_request:
    paths:
      - "pagepocket/frontend/**"
  push:
    branches: [main]
    paths:
      - "pagepocket/frontend/**"

defaults:
  run:
    working-directory: pagepocket/frontend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pagepocket/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: pnpm size-limit

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pagepocket/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Start backend stack
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE: http://localhost:8080/api/v1

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: pagepocket/frontend/playwright-report/
          retention-days: 7

      - name: Teardown backend stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
