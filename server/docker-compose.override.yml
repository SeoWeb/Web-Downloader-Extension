# Local dev override: run the downloader microservice without the PagePocket
# cloud-archive (mTLS) integration. Reuses the already-running PagePocket MySQL
# on the shared `pagepocket_default` network so no second DB is spawned.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --build

services:
  app:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MYSQL_CONNECTION_STRING: mysql+aiomysql://root:pagepocket@pagepocket-mysql-1:3306/website_downloader
      ARCHIVE_SERVICE_ADDR: "archive-service:50052"
      ARCHIVE_CA_CERT: ""
      ARCHIVE_CLIENT_KEY: ""
      ARCHIVE_CLIENT_CERT: ""
      PROTO_DIR: /app/proto_generated
      CORS_ALLOWED_ORIGINS: "[]"
      STORAGE_ROOT: /app/storage
    depends_on: []
    networks:
      - pagepocket_default
    ports:
      - "8000:8000"

networks:
  pagepocket_default:
    external: true
