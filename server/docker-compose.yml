services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - MYSQL_CONNECTION_STRING=mysql+aiomysql://webdownloader:webdownloader_password@db:3306/website_downloader
      - STORAGE_ROOT=/app/storage
      - CORS_ALLOWED_ORIGINS=[]
      - ARCHIVE_SERVICE_ADDR=archive-service:50052
      - ARCHIVE_CA_CERT=/app/certs/ca.pem
      - ARCHIVE_CLIENT_KEY=/app/certs/extension-server-key.pem
      - ARCHIVE_CLIENT_CERT=/app/certs/extension-server.pem
      - PROTO_DIR=/app/proto_generated
    volumes:
      - ./storage:/app/storage
      - ../pagepocket/shared/proto_generated:/app/proto_generated:ro
      - ../pagepocket/certs:/app/certs:ro
    command: ["sh", "-c", "i=0; until python -c 'import socket; socket.create_connection((\"db\",3306),timeout=1)' 2>/dev/null; do sleep 1; i=$$((i+1)); if [ $$i -ge 120 ]; then echo 'Timed out waiting for db:3306' >&2; exit 1; fi; done; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    networks:
      - default
      - pagepocket_default
    restart: always
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2g
    mem_swappiness: 0
    oom_kill_disable: true

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: website_downloader
      MYSQL_USER: webdownloader
      MYSQL_PASSWORD: webdownloader_password
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-allowed-packet=64M
    volumes:
      - mysql_data:/var/lib/mysql
    # Exposing MySQL port for development/debugging only.
    # Remove the 'ports' mapping in production to avoid external DB access.
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  pagepocket_default:
    external: true
