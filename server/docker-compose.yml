services:
  app:
    build: .
    env_file:
      - .env
    ports:
      # 5.11: host-only binding — nginx fronts server.pagepocket.app via
      # 127.0.0.1:8000; the monolith must not be directly reachable from the
      # internet (spike finding a: it previously listened on 0.0.0.0 and the
      # direct path carried only spoofable client-supplied forwarding headers).
      - "127.0.0.1:8000:8000"
    environment:
      # Credentials are interpolated from server/.env (0600, never committed).
      # scripts/prod/rotate-credentials.sh writes the rotated values there;
      # the inline fallbacks are the legacy committed values kept only so a
      # fresh dev checkout boots. The DB container env below must stay in
      # sync (MYSQL_USER / MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD).
      - MYSQL_CONNECTION_STRING=mysql+aiomysql://${MYSQL_USER:-webdownloader}:${MYSQL_PASSWORD:-webdownloader_password}@db:3306/website_downloader
      - STORAGE_ROOT=/app/storage
      - CORS_ALLOWED_ORIGINS=[]
      - ARCHIVE_SERVICE_ADDR=archive-service:50052
      - ARCHIVE_CA_CERT=/app/certs/ca.pem
      - ARCHIVE_CLIENT_KEY=/app/certs/extension-server-key.pem
      - ARCHIVE_CLIENT_CERT=/app/certs/extension-server.pem
      - AUTH_SERVICE_ADDR=auth-service:50051
      - AUTH_CA_CERT=/app/certs/ca.pem
      - AUTH_CLIENT_KEY=/app/certs/extension-server-key.pem
      - AUTH_CLIENT_CERT=/app/certs/extension-server.pem
      - PROTO_DIR=/app/proto_generated
    volumes:
      - ./storage:/app/storage
      - ../pagepocket/shared/proto_generated:/app/proto_generated:ro
      - ../pagepocket/certs:/app/certs:ro
    command: ["sh", "-c", "i=0; until python -c 'import socket; socket.create_connection((\"db\",3306),timeout=1)' 2>/dev/null; do sleep 1; i=$$((i+1)); if [ $$i -ge 120 ]; then echo 'Timed out waiting for db:3306' >&2; exit 1; fi; done; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    networks:
      - default
      # D12/2.17 (confinement): the monolith joins pagepocket-monolith —
      # the network that carries ONLY archive-service and auth-service —
      # instead of pagepocket_default. On pagepocket-monolith the docker
      # embedded DNS does not resolve search-/library-/share-service, so
      # they are unreachable from here (no iptables involved). Requires the
      # pagepocket stack to be up once (compose creates the named network;
      # it is declared external below). Applying the switch to the RUNNING
      # monolith is a deploy-gated operator action — apply + verification:
      # scripts/prod/README.md §Monolith network confinement.
      - pagepocket-monolith
    restart: always
    depends_on:
      db:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2g
    mem_swappiness: 0
    oom_kill_disable: true

  db:
    image: mysql:8.0
    environment:
      # 5.12: rotate via scripts/prod/rotate-credentials.sh, which writes the
      # real values into server/.env and recreates these containers. NOTE:
      # MYSQL_ROOT_PASSWORD only seeds a FRESH datadir — on the existing
      # volume the effective credential is changed by the script's ALTER USER
      # pass; the env here keeps a recreated container consistent with .env.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: website_downloader
      MYSQL_USER: ${MYSQL_USER:-webdownloader}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webdownloader_password}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-allowed-packet=64M
    volumes:
      - mysql_data:/var/lib/mysql
    # 5.11: :33060 is no longer published AT ALL — the spike found it OPEN to
    # the internet (0.0.0.0:33060->3306) with a committed root credential
    # (finding c). Host-side debugging: docker exec -it server-db-1 mysql -u root -p
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  # D12/2.17: confined monolith attachment (archive-service + auth-service
  # only). Created by the pagepocket compose project (see
  # pagepocket/docker-compose.yml) — bring the pagepocket stack up first,
  # or create it manually: docker network create pagepocket-monolith.
  pagepocket-monolith:
    external: true
